<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Cognifin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--text:#f2f0eb;--text2:#a09a90;--text3:#5a5650;--accent:#00e5a0;--border:#252525;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
h1{font-family:'Playfair Display',serif;font-size:80px;font-weight:900;color:var(--accent);letter-spacing:-3px;margin-bottom:8px;}
p{font-size:16px;color:var(--text2);margin-bottom:28px;}
a{display:inline-block;background:var(--accent);color:#000;text-decoration:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:14px;transition:opacity 0.2s;}
a:hover{opacity:0.85;}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <p>Page not found. This route doesn't exist.</p>
  <a href="/">← Back to Cognifin</a>
</div>
</body>
</html>
