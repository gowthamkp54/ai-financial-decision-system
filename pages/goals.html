<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals — Cognifin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/shared.css">
<style>
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-bottom:32px;}
.goal-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:24px;transition:all 0.3s;position:relative;overflow:hidden;}
.goal-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.goal-icon{font-size:28px;margin-bottom:14px;}
.goal-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px;}
.goal-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:16px;}
.goal-amounts{display:flex;justify-content:space-between;margin-bottom:12px;align-items:flex-end;}
.goal-current{font-size:22px;font-weight:700;font-family:'Playfair Display',serif;}
.goal-target{font-size:13px;color:var(--text3);}
.goal-pct{font-size:24px;font-weight:900;font-family:'Playfair Display',serif;color:var(--accent);}
.goal-progress{height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.goal-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#00a070);transition:width 1s ease;}
.goal-days{font-size:11px;color:var(--text3);}
.goal-days span{color:var(--text2);font-weight:600;}
.goal-needed{font-size:12px;color:var(--text2);margin-top:8px;background:var(--bg3);border-radius:8px;padding:8px 12px;}
.goal-on-track{font-size:11px;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-top:8px;}
.on-track{background:var(--green-dim);color:var(--accent);border:1px solid rgba(0,229,160,0.2);}
.off-track{background:var(--red-dim);color:var(--red);border:1px solid rgba(224,85,85,0.2);}
.goal-corner{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:0.06;}
.add-goal-card{background:transparent;border:1px dashed var(--border2);border-radius:18px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all 0.3s;min-height:200px;}
.add-goal-card:hover{border-color:rgba(0,229,160,0.4);background:var(--green-dim);}
.add-goal-card span{font-size:13px;color:var(--text3);}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-mark">C</div><div class="logo-text">Cognifin</div></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Overview</div>
      <a href="/dashboard" class="nav-item" data-page="/dashboard"><span class="nav-icon">⬡</span> Dashboard</a>
      <a href="/portfolio" class="nav-item" data-page="/portfolio"><span class="nav-icon">◈</span> Portfolio</a>
      <a href="/goals" class="nav-item active" data-page="/goals"><span class="nav-icon">◎</span> Goals</a>
      <div class="nav-section">Tools</div>
      <a href="/chat" class="nav-item" data-page="/chat"><span class="nav-icon">✦</span> AI Chat</a>
      <div class="nav-section">Account</div>
      <a href="/profile" class="nav-item" data-page="/profile"><span class="nav-icon">◯</span> Profile & API Key</a>
      <button class="nav-item" id="logoutBtn" style="color:var(--red);"><span class="nav-icon">→</span> Sign Out</button>
    </nav>
    <div class="sidebar-footer">
      <a href="/profile" class="user-pill" style="text-decoration:none;">
        <div class="user-av" id="sidebarUserAv">U</div>
        <div><div class="user-name" id="sidebarUserName">Loading…</div><div class="user-plan" id="sidebarUserPlan">Starter</div></div>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header fade-up">
      <h1>Goals</h1>
      <p>Track your financial targets and required monthly SIP</p>
    </div>
    <div class="page-body">
      <div class="stat-grid fade-up-2" id="goalStats"></div>
      <div class="goals-grid fade-up-3" id="goalsGrid">
        <div style="color:var(--text3);font-size:13px;padding:20px;">Loading goals…</div>
      </div>

      <!-- Goal insights -->
      <div class="card fade-up-4">
        <div class="card-title">✦ Cognifin Insight</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.7;" id="goalInsight">
          Loading goal analysis…
        </div>
        <a href="/chat" class="btn btn-primary btn-sm" style="margin-top:16px;width:fit-content;">Ask for goal optimization →</a>
      </div>
    </div>
  </main>
</div>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="toast-container"></div>
<script src="/assets/js/shared.js"></script>
<script>
const goalIcons = ['🎯','🏠','✈️','🎓','🏖️','💰','🚗','💎'];

function daysUntil(deadline) {
  return Math.max(0, Math.ceil((new Date(deadline) - Date.now()) / 86400000));
}

function monthsUntil(deadline) {
  const d = new Date(deadline);
  const now = new Date();
  return Math.max(1, (d.getFullYear()-now.getFullYear())*12 + (d.getMonth()-now.getMonth()));
}

function requiredSIP(remaining, months, r=0.01) {
  // Monthly SIP formula: S = P * r / ((1+r)^n - 1)
  if (months <= 0) return remaining;
  return Math.ceil(remaining * r / (Math.pow(1+r, months) - 1));
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;
  initCursor(); initSidebar();

  try {
    const goals = await api.get('/portfolio/goals');
    const totalTarget = goals.reduce((a,g)=>a+g.target,0);
    const totalCurrent = goals.reduce((a,g)=>a+g.current,0);
    const overallPct = ((totalCurrent/totalTarget)*100).toFixed(1);

    document.getElementById('goalStats').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Goals</div><div class="stat-value">${goals.length}</div><div class="stat-sub">Tracked targets</div></div>
      <div class="stat-card"><div class="stat-label">Total Target</div><div class="stat-value">${fmt(totalTarget)}</div><div class="stat-sub">Combined goal value</div></div>
      <div class="stat-card"><div class="stat-label">Funded So Far</div><div class="stat-value stat-up">${fmt(totalCurrent)}</div><div class="stat-sub">${overallPct}% of total</div></div>
      <div class="stat-card"><div class="stat-label">Still Needed</div><div class="stat-value">${fmt(totalTarget-totalCurrent)}</div><div class="stat-sub">Across all goals</div></div>`;

    document.getElementById('goalsGrid').innerHTML = goals.map((g, i) => {
      const pct = Math.min(100, (g.current/g.target*100));
      const days = daysUntil(g.deadline);
      const months = monthsUntil(g.deadline);
      const remaining = g.target - g.current;
      const sip = requiredSIP(remaining, months);
      const onTrack = g.current >= (g.target * (1 - days/365));
      const icon = goalIcons[i % goalIcons.length];
      const colors = ['var(--accent)','var(--gold)','var(--blue, #4d9fff)','#c084fc','#fb923c'];
      const color = colors[i % colors.length];

      return `<div class="goal-card fade-up" style="animation-delay:${i*0.08}s">
        <div class="goal-corner" style="background:${color};"></div>
        <div class="goal-icon">${icon}</div>
        <div class="goal-name">${g.name}</div>
        <div class="goal-meta">
          <span>Deadline: ${fmtDate(g.deadline)}</span>
          <span>${days} days left</span>
        </div>
        <div class="goal-amounts">
          <div>
            <div class="goal-current" style="color:${color};">${fmt(g.current)}</div>
            <div class="goal-target">of ${fmt(g.target)}</div>
          </div>
          <div class="goal-pct" style="color:${color};">${pct.toFixed(0)}%</div>
        </div>
        <div class="goal-progress">
          <div class="goal-fill" style="width:${pct}%;background:linear-gradient(90deg,${color},${color}88);"></div>
        </div>
        <div class="goal-days">Deadline: <span>${fmtDate(g.deadline)}</span> · ${months} months</div>
        <div class="goal-needed">Required SIP: <strong style="color:${color};">${fmt(sip)}/mo</strong> at 12% p.a.</div>
        <div class="goal-on-track ${onTrack?'on-track':'off-track'}">${onTrack?'✓ On track':'⚠ Needs attention'}</div>
      </div>`;
    }).join('') + `<div class="add-goal-card" onclick="toast('Goal creation coming soon! Use AI Chat to plan your goals.','info')">
      <span style="font-size:28px;color:var(--text3);">+</span>
      <span>Add New Goal</span>
    </div>`;

    // Insight
    const offTrack = goals.filter(g => {
      const days = daysUntil(g.deadline);
      return g.current < (g.target * (1 - days/730));
    });
    const bigGoal = [...goals].sort((a,b)=>b.target-a.target)[0];
    document.getElementById('goalInsight').innerHTML = offTrack.length > 0
      ? `<strong>${offTrack.length} goal(s) need attention.</strong> "${offTrack[0].name}" requires ${fmt(requiredSIP(offTrack[0].target-offTrack[0].current, monthsUntil(offTrack[0].deadline)))}/month in SIP to hit its target. Consider reallocating from underperforming funds to close the gap.<br><br>Your largest goal "<strong>${bigGoal.name}</strong>" (${fmt(bigGoal.target)}) has ${((bigGoal.current/bigGoal.target)*100).toFixed(1)}% funded. At current growth rate, you'll reach it in ${Math.ceil((bigGoal.target-bigGoal.current)/bigGoal.current*12)} months.`
      : `<strong>All goals are tracking well.</strong> Your most ambitious goal is "${bigGoal.name}" at ${fmt(bigGoal.target)}. At current XIRR of 8%, your portfolio doubles every ~9 years — ensure your SIP scales with income to stay ahead of inflation-adjusted targets.`;

  } catch(e) {
    toast('Failed to load goals.', 'error');
  }
  document.getElementById('logoutBtn')?.addEventListener('click', async () => { await api.post('/auth/logout',{}); Auth.clear(); window.location.href='/login'; });
});
</script>
</body>
</html>
