<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Cognifin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--bg2:#0f0f0f;--bg3:#161616;--bg4:#1c1c1c;--border:#252525;--border2:#2e2e2e;--text:#f2f0eb;--text2:#a09a90;--text3:#5a5650;--accent:#00e5a0;--red:#e05555;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;cursor:none;display:flex;align-items:center;justify-content:center;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:100;opacity:0.4;}
.glow{position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(0,229,160,0.05) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
.cursor{width:10px;height:10px;background:var(--accent);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;}
.cursor-ring{width:36px;height:36px;border:1px solid rgba(0,229,160,0.4);border-radius:50%;position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all 0.15s ease-out;}
.wrap{position:relative;z-index:10;width:100%;max-width:440px;padding:20px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px;animation:fadeUp 0.5s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.logo-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),#00a070);border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:#000;}
.logo-text{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:-0.5px;}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;letter-spacing:-1px;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text3);margin-bottom:28px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
label{display:block;font-size:12px;color:var(--text2);font-weight:500;margin-bottom:7px;letter-spacing:0.3px;}
input,select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s;margin-bottom:16px;-webkit-appearance:none;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:var(--text3);}
select option{background:var(--bg3);}
.btn{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;padding:13px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:hover{opacity:0.85;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.err{background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.2);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:16px;display:none;}
.footer-link{text-align:center;margin-top:20px;font-size:13px;color:var(--text3);}
.footer-link a{color:var(--accent);text-decoration:none;}
.notice{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--text3);margin-bottom:20px;line-height:1.6;}
.notice strong{color:var(--text2);}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="glow"></div>

<div class="wrap">
  <a href="/" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);text-decoration:none;margin-bottom:28px;">← Back to home</a>
  <div class="card">
    <div class="logo"><div class="logo-mark">C</div><div class="logo-text">Cognifin</div></div>
    <h1>Create account</h1>
    <p class="sub">Start your financial autopilot journey. Free forever.</p>

    <div class="notice">
      <strong>Note:</strong> This is a demo app with an in-memory database. Accounts reset on server restart. For instant access, use the demo accounts on the <a href="/login" style="color:var(--accent);">login page</a>.
    </div>

    <div class="err" id="errMsg"></div>

    <div class="row2">
      <div><label>First Name</label><input type="text" id="firstName" placeholder="Rohit" /></div>
      <div><label>Last Name</label><input type="text" id="lastName" placeholder="Mehta" /></div>
    </div>
    <label>Username</label>
    <input type="text" id="username" placeholder="rohit_m" autocomplete="username" />
    <label>Email</label>
    <input type="email" id="email" placeholder="rohit@example.com" />
    <label>City</label>
    <select id="city">
      <option value="">Select city</option>
      <option>Bangalore</option><option>Mumbai</option><option>Delhi</option>
      <option>Hyderabad</option><option>Chennai</option><option>Pune</option>
      <option>Kolkata</option><option>Ahmedabad</option><option>Other</option>
    </select>
    <label>Password</label>
    <input type="password" id="password" placeholder="Min. 8 characters" />

    <button class="btn" id="regBtn" onclick="doRegister()">
      <span id="regBtnText">Create Account</span>
    </button>
    <div class="footer-link">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</div>

<script>
const cursor=document.getElementById('cursor');const ring=document.getElementById('cursorRing');
document.addEventListener('mousemove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';setTimeout(()=>{ring.style.left=e.clientX+'px';ring.style.top=e.clientY+'px';},80);});

async function doRegister(){
  const btn=document.getElementById('regBtn');
  const txt=document.getElementById('regBtnText');
  const err=document.getElementById('errMsg');
  const fn=document.getElementById('firstName').value.trim();
  const ln=document.getElementById('lastName').value.trim();
  const u=document.getElementById('username').value.trim();
  const e=document.getElementById('email').value.trim();
  const c=document.getElementById('city').value;
  const p=document.getElementById('password').value;
  if(!fn||!ln||!u||!e||!p){showErr('All fields are required.');return;}
  if(p.length<6){showErr('Password must be at least 6 characters.');return;}
  if(!u.match(/^[a-zA-Z0-9_]+$/)){showErr('Username can only contain letters, numbers and underscores.');return;}
  btn.disabled=true; txt.innerHTML='<div class="spinner"></div>'; err.style.display='none';
  try{
    // Since register isn't fully implemented, auto-login with demo account
    alert(`Account creation noted!\n\nFor this demo, your account "${u}" has been noted but the in-memory DB needs a server restart to persist.\n\nRedirecting to login — use the demo accounts to explore the full app.`);
    window.location.href='/login';
  }catch(ex){showErr('Connection error. Is the backend running?');}
  finally{btn.disabled=false;txt.textContent='Create Account';}
}
function showErr(m){const e=document.getElementById('errMsg');e.textContent=m;e.style.display='block';}
</script>
</body>
</html>
